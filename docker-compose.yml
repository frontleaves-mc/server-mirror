# Youer Minecraft 服务器 + 状态监控页面的 Docker Compose 配置

services:
  # ------------------------------------------------------------------
  # mcstatus — 轻量级 Minecraft 服务器状态监控页面
  # 使用 nginx + PHP 直连 MC Server List Ping 协议，无需外部 API
  # ------------------------------------------------------------------
  mcstatus:
    image: php:apache
    container_name: mcstatus
    ports:
      - "8080:80"
    volumes:
      - ./mcstatus:/var/www/html:ro
    restart: unless-stopped
    networks:
      - minecraft-net

  # ------------------------------------------------------------------
  # Youer Minecraft 服务器 — 从 Docker Hub 拉取预构建镜像
  # 可通过外部管理或 PufferPanel 的同级容器生成进行管理。
  # ------------------------------------------------------------------
  youer-server:
    image: xiaolfeng/mc-youer-server-mirror:latest
    container_name: youer-server
    platform: linux/amd64   # 强制 x86_64 架构，避免 ARM 主机拉取错误架构镜像导致 JNI 本地库无法加载
    ports:
      - "25565:25565"   # Minecraft 服务器端口
    volumes:
      - server-data:/data   # 持久化的世界数据、配置、插件
    environment:
      # JVM 的最大内存分配
      MEMORY: 8G
      # Minecraft EULA 接受（必须设置为 true 才能启动）
      EULA: "false"
      # 额外的 JVM 参数（例如，-XX:+UseG1GC）
      JVM_FLAGS: ""
      # 传递给服务器 jar 的额外 Java 选项
      JAVA_OPTS: ""
    restart: unless-stopped
    # 放宽 seccomp 限制，允许 Rapier 物理引擎等 Rust FFI 库进行必要的系统调用
    security_opt:
      - seccomp:unconfined
    networks:
      - minecraft-net

# ------------------------------------------------------------------
# 命名卷 — 在容器重建后保留数据
# ------------------------------------------------------------------
volumes:
  server-data:

# ------------------------------------------------------------------
# 用于服务间通信的自定义桥接网络
# ------------------------------------------------------------------
networks:
  minecraft-net:
    driver: bridge
